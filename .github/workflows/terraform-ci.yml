on:
  workflow_call:
    # inputs:
    #   tfe-hostname:
    #     required: false
    #     description: Terraform Enterprise hostname (optional)
    #     type: string
    secrets:
      TF_TOKEN_APP_TERRAFORM_IO:
        required: false
        description: Terraform Cloud token for Terraform App (optional)

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
    
    env:
      TFE_TOKEN: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      # TFE_HOSTNAME: ${{ inputs.tfe-hostname }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ env.TFE_TOKEN }}
          # cli_config_credentials_hostname: ${{ env.TFE_HOSTNAME || null }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Terraform Plan Error
        run: echo ${{ steps.plan.outputs.stderr }}
      - name: Terraform Plan Exitcode
        run: echo ${{ steps.plan.outputs.exitcode }}

      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          FMT_OUTCOME: "${{ steps.fmt.outcome }}"
          INIT_OUTCOME: "${{ steps.init.outcome }}"
          VALIDATE_OUTCOME: "${{ steps.validate.outcome }}"
          PLAN_OUTCOME: "${{ steps.plan.outcome }}"
          VALIDATION_OUTPUT: "${{ steps.validate.outputs.stdout }}"

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |+
            const output = `#### Terraform Format and Style 🖌\`${process.env.FMT_OUTCOME}\`
            #### Terraform Initialization ⚙️\`${process.env.INIT_OUTCOME}\`
            #### Terraform Validation 🤖\`${process.env.VALIDATE_OUTCOME}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${process.env.VALIDATION_OUTPUT}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${process.env.PLAN_OUTCOME}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            terraform

            ${process.env.PLAN}
            \`\`\`

            </details>

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })`
              
